# Resiliogov 2 – hela plattformen som en Compose-stack.
#
#   docker compose up -d                      # databas + api + webb (ingen AI)
#   docker compose --profile ai-host up -d    # + AI-tjänst mot en modellserver på värden (Ollama på Mac mini)
#   docker compose --profile ai-gpu up -d     # + vLLM i container (Linux/NVIDIA)
#
# Samma fil används för den inre noden (role=operations) och den yttre
# (role=catalog); skillnaden ligger i .env. Inga utgående anrop i drift.

name: resiliogov

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-resiliogov}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:?sätt PGPASSWORD i .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/scripts/docker-initdb.sh:/docker-entrypoint-initdb.d/10-resiliogov.sh:ro
    ports:
      - "${PGPORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${PGDATABASE:-resiliogov}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://app_api:${APP_API_PASSWORD:?sätt APP_API_PASSWORD i .env}@db:5432/${PGDATABASE:-resiliogov}
      DATABASE_ADMIN_URL: postgres://postgres:${PGPASSWORD}@db:5432/${PGDATABASE:-resiliogov}
      INSTALLATION_ROLE: ${INSTALLATION_ROLE:-operations}   # catalog | operations | combined
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/resiliogov}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-resiliogov-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?sätt SESSION_SECRET i .env}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: resiliogov
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-resiliogov}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?sätt MINIO_ROOT_PASSWORD i .env}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
    ports:
      - "${API_PORT_HOST:-3000}:3000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT_HOST:-8080}:80"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-resiliogov}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?sätt MINIO_ROOT_PASSWORD i .env}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"

  # Utveckling: lokal identitetsleverantör. I drift pekar OIDC_ISSUER på
  # Trafikverkets IdP (Entra ID/ADFS) och den här tjänsten startas inte.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: [dev]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"

  # AI-tjänsten: Docling (PDF → struktur), extraktion, embeddings, chatt.
  # Pratar OpenAI-kompatibelt med en modellserver (LLM_BASE_URL).
  ai:
    build: ./services/ai
    restart: unless-stopped
    profiles: [ai-host, ai-gpu]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}   # Ollama på värden (Mac mini)
      LLM_MODEL: ${LLM_MODEL:-mistral-small:24b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      DATABASE_URL: postgres://app_api:${APP_API_PASSWORD}@db:5432/${PGDATABASE:-resiliogov}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - aicache:/root/.cache

  # Linux + NVIDIA: modellservern i container. På Mac mini används Ollama på
  # värden i stället (profil ai-host).
  vllm:
    image: vllm/vllm-openai:v0.11.0
    profiles: [ai-gpu]
    restart: unless-stopped
    command: >
      --model ${VLLM_MODEL:-mistralai/Mistral-Small-4-24B-Instruct}
      --served-model-name ${LLM_MODEL:-mistral-small:24b}
      --max-model-len 32768
      --guided-decoding-backend xgrammar
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${MODEL_DIR:-./models}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  dbdata:
  miniodata:
  aicache:
