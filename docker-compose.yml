# Resiliogov 2 – hela plattformen som en Compose-stack.
#
#   docker compose up -d                      # databas + api + webb (ingen AI)
#   docker compose --profile ai-host up -d    # + AI-tjänst mot en modellserver på värden (Ollama på Mac mini)
#   docker compose --profile ai-gpu up -d     # + vLLM i container (Linux/NVIDIA)
#
# Samma fil används för den inre noden (role=operations) och den yttre
# (role=catalog); skillnaden ligger i .env. Inga utgående anrop i drift.

name: resiliogov

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-resiliogov}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:?sätt PGPASSWORD i .env}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?sätt APP_API_PASSWORD i .env}   # används av init-skriptet för rollen app_api
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./db/scripts/docker-initdb.sh:/docker-entrypoint-initdb.d/10-resiliogov.sh:ro
    ports:
      - "${PGPORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${PGDATABASE:-resiliogov}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # PostgREST: samma datagränssnitt som prototypen hade via Supabase, men mot
  # vår egen databas. Nås bara via api (som lägger på JWT från sessionen).
  postgrest:
    image: postgrest/postgrest:v13.0.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://app_api:${APP_API_PASSWORD:?sätt APP_API_PASSWORD i .env}@db:5432/${PGDATABASE:-resiliogov}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?sätt JWT_SECRET i .env (minst 32 tecken)}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_OPENAPI_MODE: disabled
      PGRST_SERVER_PORT: 3001

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://app_api:${APP_API_PASSWORD:?sätt APP_API_PASSWORD i .env}@db:5432/${PGDATABASE:-resiliogov}
      DATABASE_ADMIN_URL: postgres://postgres:${PGPASSWORD}@db:5432/${PGDATABASE:-resiliogov}
      INSTALLATION_ROLE: ${INSTALLATION_ROLE:-operations}   # catalog | operations | combined
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://keycloak:8080/realms/resiliogov}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-resiliogov-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_INTERNAL_BASE: ${OIDC_INTERNAL_BASE:-}
      JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://postgrest:3001
      FILE_STORAGE: ${FILE_STORAGE:-local}   # local (volym) | s3 (egen objektlagring, sätt S3_* i .env)
      FILE_DIR: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-resiliogov}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
    volumes:
      - files:/data/files
    ports:
      - "${API_PORT_HOST:-3000}:3000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT_HOST:-8080}:80"


  # Utveckling: lokal identitetsleverantör. I drift pekar OIDC_ISSUER på
  # Trafikverkets IdP (Entra ID/ADFS) och den här tjänsten startas inte.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: [dev]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HTTP_ENABLED: "true" 
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"

  # AI-tjänsten: Docling (PDF → struktur), extraktion, embeddings, chatt.
  # Pratar OpenAI-kompatibelt med en modellserver (LLM_BASE_URL).
  ai:
    build: ./services/ai
    restart: unless-stopped
    profiles: [ai-host, ai-gpu]
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}   # Ollama på värden (Mac mini)
      LLM_MODEL: ${LLM_MODEL:-mistral-small:24b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      DATABASE_URL: postgres://app_api:${APP_API_PASSWORD}@db:5432/${PGDATABASE:-resiliogov}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - aicache:/root/.cache
      - ${EVAL_DOCS_DIR:-./services/ai/eval/docs}:/srv/eval/docs:ro   # källdokument för modellutvärdering (aldrig i git)
      - ./services/ai/eval/results:/srv/eval/results                  # utvärderingsresultat (delresultat + sammanfattningar)

  # Linux + NVIDIA: modellservern i container. På Mac mini används Ollama på
  # värden i stället (profil ai-host).
  vllm:
    image: vllm/vllm-openai:v0.11.0
    profiles: [ai-gpu]
    restart: unless-stopped
    command: >
      --model ${VLLM_MODEL:-mistralai/Mistral-Small-4-24B-Instruct}
      --served-model-name ${LLM_MODEL:-mistral-small:24b}
      --max-model-len 32768
      --guided-decoding-backend xgrammar
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${MODEL_DIR:-./models}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Yttre noden: publiceras via Cloudflare Tunnel (inga öppna portar på Hetzner).
  # Åtkomst skyddas med Cloudflare Access framför tunneln.
  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # krävs bara med --profile tunnel
    depends_on: [web]

volumes:
  dbdata:
  files:
  aicache:
