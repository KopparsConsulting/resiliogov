server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Filuppladdningar (PDF-källdokument, verifikat)
    client_max_body_size 100m;

    # API:t (Fastify) i samma Compose-nät. proxy_buffering off krävs för
    # SSE-strömmarna från regulatory-chat och analytics-chat.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashade byggartefakter kan cachas länge
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: alla övriga vägar ger index.html
    location / {
        try_files $uri /index.html;
    }
}
