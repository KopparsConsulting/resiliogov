server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Filuppladdningar (PDF-källdokument, verifikat)
    client_max_body_size 100m;

    # API:t (Fastify) i samma Compose-nät. proxy_buffering off krävs för
    # SSE-strömmarna från regulatory-chat och analytics-chat.
    # Slå upp api-containerns adress vid varje anrop (Dockers DNS), annars
    # håller nginx fast vid en gammal adress när api byggs om → 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashade byggartefakter kan cachas länge
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: alla övriga vägar ger index.html – som aldrig får cachas, annars
    # pekar webbläsaren på gamla bundlar efter en ny deploy.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
